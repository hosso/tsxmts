name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # >=22.14.0 + npm >=11.5.1, required for OIDC publish
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run check

      - name: Verify release tag matches package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - run: npm publish --provenance
